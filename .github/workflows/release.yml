# Push a tag like v0.1.3 -> tests run, the .vsix is built and attached to a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Build .vsix
        run: npx --yes @vscode/vsce package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$ver" '/^## /{ if (f) exit; if ($2 == ver) f = 1; next } f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
